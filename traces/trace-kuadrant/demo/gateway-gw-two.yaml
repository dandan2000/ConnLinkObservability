# Ajustar hostname al dominio apps de tu cluster (ej. *.apps.sno.home).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-two
  namespace: connlink
  labels:
    istio.io/rev: openshift-gateway
    kuadrant.io/gateway: "true"
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: api
      port: 80
      protocol: HTTP
      hostname: "*.apps.sno.home"
      allowedRoutes:
        namespaces:
          from: All
