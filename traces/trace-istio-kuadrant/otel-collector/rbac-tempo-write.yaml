# Permite al collector escribir trazas en el tenant "dev" del Tempo gateway.
# Formato correcto: resources=tenant, resourceNames=traces (no invertir).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempo-traces-write-dev
rules:
  - apiGroups: [tempo.grafana.com]
    resourceNames: [traces]
    resources: [dev]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-tempo-write-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempo-traces-write-dev
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: openshift-tempo-operator
